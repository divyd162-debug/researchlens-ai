# Alembic configuration for ResearchLens AI (root-relative)

[alembic]
# Path to migration scripts relative to this config file
script_location = %(here)s/backend/alembic

# Ensure backend package is discoverable from repository root
prepend_sys_path = backend

# Use OS path separator
path_separator = os

# Template for migration filenames: e.g. a1b2c3d4_create_documents_table.py
file_template = %%(rev)s_%%(slug)s

output_encoding = utf-8

# DATABASE URL IS DYNAMICALLY RESOLVED IN alembic/env.py FROM settings.DATABASE_URL.
# DO NOT hardcode database credentials or secrets in this file.
# sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
